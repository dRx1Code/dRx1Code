<svg xmlns="http://www.w3.org/2000/svg" width="860" height="14" viewBox="0 0 860 14" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4C1D95" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6D28D9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C1D95" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C4B5FD" stop-opacity="1"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    .node  { animation: blink 2.2s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-260px); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateX(860px); opacity: 0; }
    }
    @keyframes blink { 0%,100% { opacity: .9; } 50% { opacity: .25; } }
  </style>
  <rect x="0" y="6.5" width="860" height="1" fill="url(#base)"/>
  <rect class="sweep" x="0" y="6" width="260" height="2" rx="1" fill="url(#glow)"/>
  <circle class="node" cx="430" cy="7" r="2.5" fill="#A78BFA"/>
</svg>
