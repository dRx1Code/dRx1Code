<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-label="Currently learning: Node.js, RESTful APIs, HTTP and client-server, SQL, software engineering principles">
  <style>
    :root { --fg: #E4E4E7; --muted: #A1A1AA; --accent: #A78BFA; --rail: #27272A; }
    @media (prefers-color-scheme: light) {
      :root { --fg: #18181B; --muted: #52525B; --accent: #6D28D9; --rail: #E4E4E7; }
    }
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .idx   { fill: var(--accent); font-size: 13px; }
    .label { fill: var(--fg); font-size: 16px; }
    .tag   { fill: var(--muted); font-size: 12px; }
    .rail  { stroke: var(--rail); stroke-width: 2; }
    .row   { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .r1 { animation-delay: .2s; } .r2 { animation-delay: .5s; } .r3 { animation-delay: .8s; }
    .r4 { animation-delay: 1.1s; } .r5 { animation-delay: 1.4s; }
    .fill  { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: grow 1.2s ease forwards; }
    .r1 .fill { animation-delay: .6s; } .r2 .fill { animation-delay: .9s; } .r3 .fill { animation-delay: 1.2s; }
    .r4 .fill { animation-delay: 1.5s; } .r5 .fill { animation-delay: 1.8s; }
    .pulse { fill: var(--accent); animation: pulse 2.4s ease-in-out infinite 2.4s; }
    @keyframes in    { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes grow  { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  </style>

  <g class="row r1">
    <text class="idx" x="8" y="34">01</text>
    <text class="label" x="48" y="34">Backend development with Node.js</text>
    <text class="tag" x="640" y="34">backend</text>
    <line class="rail" x1="740" y1="30" x2="860" y2="30"/>
    <line class="fill" x1="740" y1="30" x2="860" y2="30"/>
  </g>
  <g class="row r2">
    <text class="idx" x="8" y="80">02</text>
    <text class="label" x="48" y="80">RESTful APIs</text>
    <text class="tag" x="640" y="80">apis</text>
    <line class="rail" x1="740" y1="76" x2="860" y2="76"/>
    <line class="fill" x1="740" y1="76" x2="860" y2="76"/>
  </g>
  <g class="row r3">
    <text class="idx" x="8" y="126">03</text>
    <text class="label" x="48" y="126">HTTP and client-server architecture</text>
    <text class="tag" x="640" y="126">network</text>
    <line class="rail" x1="740" y1="122" x2="860" y2="122"/>
    <line class="fill" x1="740" y1="122" x2="860" y2="122"/>
  </g>
  <g class="row r4">
    <text class="idx" x="8" y="172">04</text>
    <text class="label" x="48" y="172">Database modeling and SQL</text>
    <text class="tag" x="640" y="172">data</text>
    <line class="rail" x1="740" y1="168" x2="860" y2="168"/>
    <line class="fill" x1="740" y1="168" x2="860" y2="168"/>
  </g>
  <g class="row r5">
    <text class="idx" x="8" y="218">05</text>
    <text class="label" x="48" y="218">Software engineering principles</text>
    <text class="tag" x="640" y="218">craft</text>
    <line class="rail" x1="740" y1="214" x2="860" y2="214"/>
    <line class="fill" x1="740" y1="214" x2="860" y2="214"/>
  </g>
</svg>
